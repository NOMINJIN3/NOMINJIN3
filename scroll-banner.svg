<svg xmlns="http://www.w3.org/2000/svg" width="860" height="44" viewBox="0 0 860 44">
<style>
  .t { font-family: "JetBrains Mono","Fira Code",Consolas,"Courier New",monospace; font-size:16px; font-weight:600; fill:#58A6FF; }
  .dot { fill:#1F6FEB; }
  .track { animation: scroll 22s linear infinite; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
</style>
<defs>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".08" stop-color="#fff" stop-opacity="1"/>
    <stop offset=".92" stop-color="#fff" stop-opacity="1"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="edges"><rect width="860" height="44" fill="url(#fade)"/></mask>
  <g id="line">
    <text class="t" y="28" textLength="1370" lengthAdjust="spacing">$ echo "Information Technology ◆ Agentic Tools Developer ◆ Cyber Security ◆ Intern @ erxes Mongolia ◆ Code w/ purpose, automate ◆ Turning curiosity into code"</text>
  </g>
</defs>
<g mask="url(#edges)">
  <g class="track">
    <use href="#line" x="0"/>
    <use href="#line" x="1400"/>
  </g>
</g>
</svg>
