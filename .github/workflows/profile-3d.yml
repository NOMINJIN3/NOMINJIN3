name: GitHub-Profile-3D-Contrib

on:
  schedule: # 18:00 UTC == 02:00 Ulaanbaatar
    - cron: "0 18 * * *"
  workflow_dispatch:
  push: # run once right away when this workflow file changes
    branches: [main]
    paths: [".github/workflows/profile-3d.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Optional: add a CONTRIB_TOKEN secret (classic PAT, scopes repo + read:user)
          # to include private contributions. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "generated 3D contribution graph"; then
            git pull --rebase
            git push
          fi
