<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 200" width="100%" height="100%">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d"/>
      <stop offset="50%" stop-color="#8b949e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>

    <!-- Header Gradient Glow -->
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>

    <!-- Floor Reflection Gradient -->
    <linearGradient id="reflectionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .title { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      font-size: 16px; 
      font-weight: 700; 
      fill: url(#textGlow); 
    }
    .lang-name { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      font-size: 12px; 
      font-weight: 500; 
      fill: #c9d1d9; 
    }
    .lang-pct { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      font-size: 12px; 
      font-weight: 400; 
      fill: #8b949e; 
    }

    /* CSS Keyframe Animations */
    @keyframes growBar {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.25; }
    }

    /* Animation Classes & Delays */
    .bar-container {
      transform-origin: left center;
      animation: growBar 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .bg-glow {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    .item {
      opacity: 0;
      animation: fadeInUp 0.5s ease-out forwards;
    }

    .item-1 { animation-delay: 0.3s; }
    .item-2 { animation-delay: 0.45s; }
    .item-3 { animation-delay: 0.6s; }
    .item-4 { animation-delay: 0.75s; }
    .item-5 { animation-delay: 0.9s; }
  </style>

  <!-- Ambient Backdrop Glow (Pulsing) -->
  <rect class="bg-glow" x="25" y="20" width="400" height="160" rx="12" fill="#1f6beb" opacity="0.12" filter="url(#glow)"/>

  <!-- Main Card Container -->
  <rect x="25" y="20" width="400" height="160" rx="12" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2"/>

  <!-- Top Inner Reflection Line -->
  <path d="M 37 21 L 413 21" stroke="url(#reflectionGrad)" stroke-width="1" fill="none"/>

  <!-- Card Title -->
  <text x="45" y="50" class="title">Most Used Languages</text>

  <!-- Animated Multi-Color Progress Bar -->
  <g transform="translate(45, 65)">
    <svg width="360" height="10" rx="5" ry="5">
      <g class="bar-container">
        <!-- JavaScript: 53.01% -->
        <rect x="0" y="0" width="190.84" height="10" fill="#f1e05a"/>
        <!-- HTML: 29.17% -->
        <rect x="191.84" y="0" width="105.01" height="10" fill="#e34c26"/>
        <!-- CSS: 11.79% -->
        <rect x="297.85" y="0" width="42.44" height="10" fill="#563d7c"/>
        <!-- Python: 4.34% -->
        <rect x="341.29" y="0" width="15.62" height="10" fill="#3572A5"/>
        <!-- TypeScript: 1.75% -->
        <rect x="357.91" y="0" width="6.30" height="10" fill="#3178c6"/>
      </g>
    </svg>
  </g>

  <!-- Animated Language Grid Legend (Column 1) -->
  <g transform="translate(45, 100)">
    <!-- JavaScript -->
    <g class="item item-1">
      <circle cx="5" cy="5" r="4.5" fill="#f1e05a"/>
      <text x="16" y="9" class="lang-name">JavaScript <tspan class="lang-pct">53.01%</tspan></text>
    </g>

    <!-- HTML -->
    <g class="item item-2">
      <circle cx="5" cy="27" r="4.5" fill="#e34c26"/>
      <text x="16" y="31" class="lang-name">HTML <tspan class="lang-pct">29.17%</tspan></text>
    </g>

    <!-- CSS -->
    <g class="item item-3">
      <circle cx="5" cy="49" r="4.5" fill="#563d7c"/>
      <text x="16" y="53" class="lang-name">CSS <tspan class="lang-pct">11.79%</tspan></text>
    </g>
  </g>

  <!-- Animated Language Grid Legend (Column 2) -->
  <g transform="translate(235, 100)">
    <!-- Python -->
    <g class="item item-4">
      <circle cx="5" cy="5" r="4.5" fill="#3572A5"/>
      <text x="16" y="9" class="lang-name">Python <tspan class="lang-pct">4.34%</tspan></text>
    </g>

    <!-- TypeScript -->
    <g class="item item-5">
      <circle cx="5" cy="27" r="4.5" fill="#3178c6"/>
      <text x="16" y="31" class="lang-name">TypeScript <tspan class="lang-pct">1.75%</tspan></text>
    </g>
  </g>
</svg>
