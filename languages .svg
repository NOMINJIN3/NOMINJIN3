<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>

    <!-- Top Highlight Line -->
    <linearGradient id="topLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: url(#titleGrad);
    }
    .lang-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e6edf3;
    }
    .lang-percent {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 400;
      fill: #8b949e;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: #6e7681;
    }
  </style>

  <!-- Card Frame -->
  <rect x="5" y="5" width="470" height="200" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <path d="M 20 6 L 460 6" stroke="url(#topLineGrad)" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Title & Username Header -->
  <text x="30" y="38" class="title-text">Most Used Languages</text>
  <text x="450" y="38" class="subtitle" text-anchor="end">@NOMINJIN3</text>

  <!-- Progress Bar Container -->
  <g transform="translate(30, 56)">
    <rect x="0" y="0" width="420" height="12" rx="6" fill="#21262d"/>
    <g>
      <clipPath id="barClip">
        <rect x="0" y="0" width="420" height="12" rx="6"/>
      </clipPath>
      <g clip-path="url(#barClip)">
        <!-- JavaScript (53.01%) -->
        <rect x="0" y="0" width="222.64" height="12" fill="#f1e05a"/>
        <!-- HTML (29.17%) -->
        <rect x="223.64" y="0" width="122.51" height="12" fill="#e34c26"/>
        <!-- CSS (11.79%) -->
        <rect x="347.15" y="0" width="49.52" height="12" fill="#563d7c"/>
        <!-- Python (4.34%) -->
        <rect x="397.67" y="0" width="18.23" height="12" fill="#3572a5"/>
        <!-- TypeScript (1.75%) -->
        <rect x="416.90" y="0" width="7.35" height="12" fill="#022658"/>
      </g>
    </g>
  </g>

  <!-- Language Grid Legend -->
  <!-- Column 1 -->
  <g transform="translate(30, 95)">
    <!-- JavaScript -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#f1e05a"/>
      <text x="20" y="10" class="lang-name">JavaScript <tspan class="lang-percent">53.01%</tspan></text>
    </g>
    <!-- HTML -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="5" fill="#e34c26"/>
      <text x="20" y="10" class="lang-name">HTML <tspan class="lang-percent">29.17%</tspan></text>
    </g>
    <!-- CSS -->
    <g transform="translate(0, 64)">
      <circle cx="6" cy="6" r="5" fill="#563d7c"/>
      <text x="20" y="10" class="lang-name">CSS <tspan class="lang-percent">11.79%</tspan></text>
    </g>
  </g>

  <!-- Column 2 -->
  <g transform="translate(250, 95)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="5" fill="#3572a5"/>
      <text x="20" y="10" class="lang-name">Python <tspan class="lang-percent">4.34%</tspan></text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(0, 32)">
      <circle cx="6" cy="6" r="5" fill="#022658"/>
      <text x="20" y="10" class="lang-name">TypeScript <tspan class="lang-percent">1.75%</tspan></text>
    </g>
  </g>
</svg>
